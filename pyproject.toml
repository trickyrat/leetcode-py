[project]
name = "leetcode-py"
version = "0.1.0"
description = "LeetCode solution implemented in python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
[dependency-groups]
dev = [
    "black>=25.1.0",
    "coverage>=7.7.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]


[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"

